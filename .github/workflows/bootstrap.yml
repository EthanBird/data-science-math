name: Build derivation library

on:
  push:
    paths:
      - bootstrap.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Expand reviewed source tree
        run: |
          python bootstrap.py
          rm bootstrap.py
          rm -rf tools/__pycache__
          python tools/generate.py

      - name: Validate Markdown structure
        run: python tools/validate_markdown.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compile every formula with KaTeX
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node tools/validate_katex.mjs

      - name: Commit generated library
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build complete mathematical derivation library"
          git push
